name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Vitest 5 needs Node 22+; on Node 20 we only check that the published CLI runs.
      - run: pnpm test
        if: matrix.node != 20
      - run: pnpm build
      - name: CLI smoke test
        shell: bash
        run: |
          node dist/node/bin/asset-review.js --version
          node dist/node/bin/asset-review.js notes examples
          mkdir -p "$RUNNER_TEMP/proj" && node dist/node/bin/asset-review.js init "$RUNNER_TEMP/proj"
          test -f "$RUNNER_TEMP/proj/review.config.json"
